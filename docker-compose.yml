version: '3.8'

services:
  # 1. The Backend Service
  backend:
    build:
      context: ./backend  # Looks for the 'Dockerfile' in the 'backend' folder
    ports:
      - "8000:8080" # Maps your laptop's port 8000 to the container's port 8080
    volumes:
      # This is for hot-reloading. It syncs your local 'app' folder
      # with the 'app' folder inside the container.
      - ./backend/app:/app/app
    environment:
      # This is the "key" to the database.
      # It tells FastAPI to connect to the 'db' service on port 5432.
      DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_db"
      # CRITICAL: alembic (seed.py / env.py) prefers MIGRATION_DATABASE_URL.
      # backend/.env sets that to PRODUCTION Neon, so without this override a
      # local `docker compose up` would run migrations against prod. Pin it to
      # the local db so local migrations stay local.
      MIGRATION_DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_db"
      # Redis (rate limiter + cache). Compose service name is `redis`.
      REDIS_URL: "redis://redis:6379/0"
      # Workerless mode — see docs/adr/001-workerless-inline-tasks.md.
      #
      # /** WHY THE DEFAULT IS `true`: production has NO worker. It was deleted
      #     for cost, and tasks run inline in the web process. This used to
      #     default to `false`, which meant local dev ran the OPPOSITE semantics
      #     to production, and the behaviour silently depended on whether the
      #     optional `worker` container happened to be running:
      #
      #       docker compose up -d                  -> worker runs, tasks drain
      #       docker compose up -d backend db redis -> NOTHING consumes the queue
      #
      #     In the second case every `.delay()` enqueued to Redis and sat there,
      #     so published stories stayed `pending` forever and verification emails
      #     were never sent — with no error anywhere, because the enqueue itself
      #     succeeded. That is a confusing way to lose an afternoon, and it is
      #     not a bug that exists in production at all.
      #
      #     Local now matches prod by default. To exercise the real worker path
      #     (e.g. to test retries, which only work with a worker), opt in:
      #       CELERY_TASK_ALWAYS_EAGER=false docker compose up -d **/
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-true}

      # We load all other secrets from your .env file
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY} # Make sure this matches your .env

      # Admin credentials for the seed script
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    env_file:
      - backend/.env # Loads the .env file from the backend folder
    depends_on:
      db: # Tells this service to wait until the 'db' service is healthy
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hits the /healthz endpoint added in Round 3; frontend gates on this
    # so the first request doesn't race an unmigrated backend.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. The Frontend Service
  frontend:
    build:
      context: ./frontend # Looks for the 'Dockerfile' in the 'frontend' folder
      target: dev        # Tells Docker to build the 'dev' stage (for hot-reloading)
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # This "un-mounts" node_modules, using the one inside the container
      - /app/.next # Same trick for the Next build cache — on Windows, writing
                   # .next through the host bind mount races Turbopack's
                   # temp-file renames (ENOENT on _buildManifest.js.tmp.*)
    environment:
      # Browser-facing URL — the published host port, since this value ships
      # to the client bundle and runs in the user's own browser.
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      # Server-only (no NEXT_PUBLIC_ prefix — never sent to the browser).
      # Server Components / route handlers run inside THIS container, where
      # "localhost:8000" is this frontend container, not the backend one —
      # they need the Docker-network service name instead. See lib/axios.ts.
      API_URL_INTERNAL: "http://backend:8080"
      # This is required for Next.js hot-reloading to work inside Docker
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

  # 4. Celery worker — Phase 2 of UPGRADE_PLAN. Runs the same image as the
  #    backend so tasks share code + models automatically. Add more replicas
  #    with `docker compose up --scale worker=N` when a slow task starts
  #    hogging capacity.
  worker:
    build:
      context: ./backend
    # recommended by claude opus 4.7: --concurrency=2 keeps memory bounded on
    # dev machines. Prod should raise this via `--scale worker` (many small
    # processes) rather than bumping concurrency (fewer big ones), which
    # plays badly with the GIL for CPU-bound tasks.
    command: >
      python -m celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=2
      --prefetch-multiplier=1
    environment:
      DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_db"
      # Keep migrations local even if SKIP_MIGRATIONS is ever flipped off.
      MIGRATION_DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # The backend service already runs migrations + seed on its own
      # startup; skip here so both containers don't race Alembic against
      # the same fresh database.
      SKIP_MIGRATIONS: "true"
    env_file:
      - backend/.env
    # The image defines a HEALTHCHECK that curls /healthz on :8080 — right for
    # the API, wrong for the worker (Celery binds no HTTP port). Disable it here
    # so the worker never shows unhealthy for lacking an endpoint it shouldn't have.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # 5. Redis — rate limiter + cache + Celery broker (Phase 1 of UPGRADE_PLAN)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. The Database Service
  db:
    image: postgres:16 # Use the official PostgreSQL 16 image
    ports:
      - "5432:5432" # Maps your laptop's port 5432 to the container's 5432
    environment:
      # This is the "bank". It creates the DB and credentials.
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    volumes:
      # This saves your database data to a 'volume' on your computer,
      # so your data is still there even if you stop/remove the container.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # This check ensures the 'backend' won't start until the DB is ready
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

# This tells Docker to create the named volume on your hard drive
volumes:
  postgres_data:
  redis_data: